services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - '127.0.0.1:17563:17563'
    volumes:
      - battle_storage:/app/storage
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '17563', '--limit-concurrency', '64']
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:17563/healthz", timeout=5)']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - battle_storage:/app/storage
    command: ['python', '-m', 'bot.main']
volumes:
  battle_storage:
