# Include in nginx http context after provisioning a TLS certificate.
# $uri excludes query strings, so OAuth codes never enter access logs.
log_format battle '$remote_addr $request_method $uri $status';
server {
    listen 80;
    server_name nexvirobattle.cfd;
    return 301 https://nexvirobattle.cfd$request_uri;
}
server {
    listen 443 ssl;
    server_name nexvirobattle.cfd;
    ssl_certificate /etc/letsencrypt/live/nexvirobattle.cfd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexvirobattle.cfd/privkey.pem;
    access_log /var/log/nginx/battle-access.log battle;
    client_max_body_size 31m;
    client_body_timeout 30s;
    location / {
        proxy_pass http://127.0.0.1:17563;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }
}
